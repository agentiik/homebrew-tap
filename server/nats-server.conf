# The bus of a server on this Mac alone, which agentiik-server runs: TLS, since the bus is never reached in
# plaintext, JetStream, and the operator and accounts agentiik-api bus-init wrote.
# Homebrew keeps this file across upgrades, and writes a newer default beside it as nats-server.conf.default.

# Loopback only, as AGK_BUS_URL says. A runner on another host needs an address it reaches.
listen: "127.0.0.1:4222"

tls {
  cert_file: "@HOMEBREW_PREFIX@/etc/agentiik/tls/server.pem"
  key_file: "@HOMEBREW_PREFIX@/etc/agentiik/tls/server.key"
}

jetstream {
  store_dir: "@HOMEBREW_PREFIX@/var/lib/agentiik/jetstream"
}

# Relative to this file, since nats-server joins an include to the directory of the file naming it,
# and an absolute path would be joined too.
include "../../var/lib/agentiik/bus/accounts.conf"
